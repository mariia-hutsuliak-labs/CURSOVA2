# Специфікація контракту рівня послуг «як код» (ЛР12, Завдання 1).
# SLI (Service Level Indicator)  - вимірюваний показник якості.
# SLO (Service Level Objective)  - внутрішня ціль команди для SLI.
# SLA (Service Level Agreement)  - зовнішня обіцянка клієнтові; завжди м'якша за SLO,
#                                  різниця SLO - SLA є буфером надійності команди.
# Error Budget = (100% - SLO) * тривалість вікна; вікно 30 діб = 43 200 хвилин.
#
# Джерело даних: Prometheus/Grafana у проєкті не розгорнуті (ISD §6, моніторинг = ціль),
# тому SLI рахуються за журналом запитів застосунку, а базові значення взято з
# навантажувального тесту ЛР2 (k6, GET /api/query6: p95 = 141 мс при 1 VU, 300 мс як поріг).
# Після впровадження моніторингу джерело замінюється на метрики Prometheus (поле source).
service: cursova2-bookstore
owner: Mariia Hutsuliak
review_date: 2027-02-15
window: { type: rolling, days: 30, minutes: 43200 }

slis:
  - id: SLI-1
    name: Availability (доступність)
    definition: >
      Частка HTTP-запитів до застосунку, що завершилися без помилки сервера
      (код відповіді менший за 500), від усіх запитів за ковзне вікно 30 діб.
    good_events: "запити з кодом відповіді < 500"
    total_events: "усі HTTP-запити до застосунку"
    source: "журнал запитів застосунку (privacy/secure_logging.py); у перспективі метрика http_requests_total у Prometheus"
    slo:
      target_percent: 99.5
      error_budget_minutes_per_30d: 216      # (100 - 99.5)% * 43200
    sla:
      target_percent: 99.0
      error_budget_minutes_per_30d: 432      # (100 - 99.0)% * 43200
    reliability_buffer_percent_points: 0.5   # SLO - SLA
    rationale: >
      Застосунок односерверний, без резервування (ISD §1), тому 99.9% недосяжні;
      99.5% дозволяє близько 3,6 години простою на місяць, тобто один неспішний
      запуск RB-001 (RTO 4 години) вже випадає за межі SLO, але ще вкладається в SLA.

  - id: SLI-2
    name: Latency of heavy report (швидкість важкого звіту)
    definition: >
      Частка запитів GET /api/query6 (повний JOIN Sale -> SaleItem -> Product ->
      ProductCategory), що виконалися швидше за 300 мс, від усіх запитів до цього
      ендпоінта за ковзне вікно 30 діб. Час вимірюється від прийняття запиту
      до відправлення відповіді на стороні сервера.
    good_events: "запити до /api/query6 з тривалістю < 300 мс"
    total_events: "усі запити до /api/query6"
    source: "журнал запитів із тривалістю; для контрольної перевірки k6-скрипт load_test_query6.js (ЛР2)"
    slo:
      target_percent: 95.0                   # еквівалент p95 < 300 мс
      error_budget_minutes_per_30d: 2160     # (100 - 95.0)% * 43200
    sla:
      target_percent: 90.0
      error_budget_minutes_per_30d: 4320     # (100 - 90.0)% * 43200
    reliability_buffer_percent_points: 5.0
    rationale: >
      Поріг 300 мс і ціль p95 взято з ЛР2: baseline p95 = 141 мс, нормальне
      навантаження (4 одночасних оператори) цей поріг витримує, підвищене (20) ні.
      Для клієнта обіцянка 90% м'якша, бо звіт залежить від обсягу даних.

  - id: SLI-3
    name: First-attempt success of DB calls (успіх із першої спроби)
    definition: >
      Частка запитів GET /api/query6, у яких звернення до БД завершилося успішно з
      першої спроби (механізм retry з resilience.py не спрацьовував), від усіх запитів
      до цього ендпоінта за ковзне вікно 30 діб. Запит, що пережив збій завдяки
      повтору, до «добрих» не належить.
    good_events: "запити до /api/query6 без жодного запису '[RESILIENCE] Спроба N/3 невдала' у журналі"
    total_events: "усі запити до /api/query6"
    source: "журнал застосунку: логер resilience (рядки '[RESILIENCE] Спроба', '[RESILIENCE] Успіх після', '[FALLBACK]')"
    slo:
      target_percent: 99.0
      error_budget_minutes_per_30d: 432      # (100 - 99.0)% * 43200
    sla:
      target_percent: 97.0
      error_budget_minutes_per_30d: 1296     # (100 - 97.0)% * 43200
    reliability_buffer_percent_points: 2.0
    rationale: >
      Retry приховує тимчасові збої БД: користувач отримує 200, але з додатковою
      затримкою 0,3 с і більше, тому SLI-1 «зелений». Цей показник ловить нестабільність
      залежності ще до того, як вичерпаються три спроби і спрацює fallback (503).
      Він близький до визначення «частка завершених без помилок фонових задач» з методички.

error_budget_policy:
  # Стан вимірюється як частка витраченого бюджету за ковзне вікно 30 діб.
  thresholds:
    - spent_percent: 50
      action: "Попередження: перегляд причин у щотижневому огляді, нові ризикові зміни виносяться на CCB з поміткою."
    - spent_percent: 75
      action: "Релізи лише класу «стандартна» та виправлення помилок; нормальні зміни потребують окремого рішення CCB."
    - spent_percent: 100
      action: >
        Change freeze: заморожуються всі релізи нових функцій. Команда працює
        лише над стабільністю (виправлення причин витрати бюджету, RB/алерти, тести)
        до відновлення бюджету. Виняток: термінові виправлення безпеки і зміни,
        що самі підвищують надійність, за рішенням CCB.
  freeze_exit: "Бюджет відновився до рівня, коли витрачено менше 100% за ковзне вікно, і CAPA-дії по причинах витрати закриті."
  linked_process: "docs/change-management/ccb-charter.md (Завдання 2): правило change freeze CCB спрацьовує при вичерпанні цього бюджету."
