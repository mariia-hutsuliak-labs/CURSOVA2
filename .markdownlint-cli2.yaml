# Правила стилю Markdown для документації (ЛР11, Завдання 3).
# Базовий набір markdownlint увімкнено повністю; нижче вимкнено лише правила,
# що не пасують до цього проєкту, і причина кожного винятку.
config:
  default: true
  MD013: false              # довжину рядка не обмежуємо: українські таблиці й посилання довгі
  MD033: false              # дозволено HTML-теги (потрібен тег <swagger-ui/> у довіднику API)
  MD024:
    siblings_only: true     # однакові заголовки допустимі в різних розділах (ADR мають однакову структуру)
  MD036: false              # жирний рядок як підпис допустимий
  MD051: false              # перевірку внутрішніх якорів виконує mkdocs build --strict
